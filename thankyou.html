<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Cian Prime Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .thankyou-box {
            background: #ffffff;
            color: #1e293b;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            animation: popIn 0.6s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: #16a34a;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .thankyou-box h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .thankyou-box h1 .logo-accent {
            color: #2563eb;
        }

        .thankyou-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #475569;
        }

        .countdown {
            font-size: 0.95rem;
            color: #64748b;
        }

        .countdown span {
            font-weight: bold;
            color: #2563eb;
        }

        .btn-home {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-home:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="thankyou-box">
        <div class="check-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Thank You from <span class="logo-accent">Cian Prime</span>!</h1>
        <p>We’ve received your quote request. Our team will review it and get back to you within 24 hours.</p>

        <p class="countdown">Redirecting you back to homepage in <span id="timer">4</span> seconds...</p>

        <a href="index.html" class="btn-home">Go Back Now</a>
    </div>

    <script>
        // Countdown and auto redirect
        let seconds = 4;
        const timer = document.getElementById('timer');

        const countdown = setInterval(() => {
            seconds--;
            timer.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "index.html";
            }
        }, 1000);
    </script>

</body>

</html>
